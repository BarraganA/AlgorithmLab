<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Algorithm Lab v0.4</title>

  <!-- Blockly -->
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/en.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #202124;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #dadce0;
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 22px;
    }

    .title-group p {
      margin: 4px 0 0;
      color: #5f6368;
      font-size: 13px;
    }

    .version {
      color: #5f6368;
      font-size: 13px;
    }

    .lab-container {
      padding: 16px;
    }

    .workspace-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 16px;
    }

    #blocklyDiv {
      width: 100%;
      height: 620px;
      background: white;
      border: 1px solid #dadce0;
      border-radius: 10px;
      overflow: hidden;
    }

    .console-panel {
      min-width: 0;
      min-height: 620px;
      background: #202124;
      color: #f1f3f4;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .console-header {
      padding: 14px 16px;
      border-bottom: 1px solid #3c4043;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: .5px;
    }

    #consoleOutput {
      flex: 1;
      padding: 16px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overflow-y: auto;
    }

    .console-placeholder {
      color: #9aa0a6;
    }

    .console-error {
      color: #f28b82;
    }

    .console-info {
      color: #8ab4f8;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 1px solid #dadce0;
      background: white;
      color: #202124;
      border-radius: 7px;
      padding: 10px 18px;
      min-height: 42px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #f1f3f4;
    }

    #runButton {
      background: #1a73e8;
      border-color: #1a73e8;
      color: white;
    }

    #runButton:hover {
      background: #1765cc;
    }

    .status-row {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: #5f6368;
    }

    @media (max-width: 850px) {
      .workspace-layout {
        grid-template-columns: 1fr;
      }

      #blocklyDiv {
        height: 540px;
      }

      .console-panel {
        min-height: 220px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="title-group">
    <h1>Algorithm Lab</h1>
    <p>Build, test and explore algorithms using blocks.</p>
  </div>

  <div class="version">
    v0.4
  </div>
</header>

<div class="lab-container">

  <div class="workspace-layout">

    <div id="blocklyDiv"></div>

    <div class="console-panel">

      <div class="console-header">
        CONSOLE
      </div>

      <div id="consoleOutput">
        <span class="console-placeholder">Ready.</span>
      </div>

    </div>

  </div>

  <div class="controls">

    <button id="runButton">
      ▶ Run
    </button>

    <button id="clearButton">
      Clear console
    </button>

    <button id="resetButton">
      ↻ Reset workspace
    </button>

  </div>

  <div class="status-row">

    <span id="status">
      Build an algorithm and press Run.
    </span>

    <span>
      Maximum operations: 10,000
    </span>

  </div>

</div>


<script>

  /*
   * =======================================================
   * CONFIGURATION
   * =======================================================
   */

  const MAX_OPERATIONS = 10000;


  /*
   * =======================================================
   * TOOLBOX
   * =======================================================
   */

  const toolbox = {

    kind: "categoryToolbox",

    contents: [

      /*
       * -----------------------
       * LOGIC
       * -----------------------
       */

      {
        kind: "category",
        name: "Logic",
        categorystyle: "logic_category",

        contents: [

          {
            kind: "block",
            type: "controls_if"
          },

          {
            kind: "block",
            type: "logic_compare"
          },

          {
            kind: "block",
            type: "logic_operation"
          },

          {
            kind: "block",
            type: "logic_negate"
          },

          {
            kind: "block",
            type: "logic_boolean"
          },

          {
            kind: "block",
            type: "logic_null"
          },

          {
            kind: "block",
            type: "logic_ternary"
          }

        ]
      },


      /*
       * -----------------------
       * LOOPS
       * -----------------------
       */

      {
        kind: "category",
        name: "Loops",
        categorystyle: "loop_category",

        contents: [

          {
            kind: "block",
            type: "controls_repeat_ext"
          },

          {
            kind: "block",
            type: "controls_whileUntil"
          },

          {
            kind: "block",
            type: "controls_for"
          },

          {
            kind: "block",
            type: "controls_forEach"
          },

          {
            kind: "block",
            type: "controls_flow_statements"
          }

        ]
      },


      /*
       * -----------------------
       * MATH
       * -----------------------
       */

      {
        kind: "category",
        name: "Math",
        categorystyle: "math_category",

        contents: [

          {
            kind: "block",
            type: "math_number"
          },

          {
            kind: "block",
            type: "math_arithmetic"
          },

          {
            kind: "block",
            type: "math_single"
          },

          {
            kind: "block",
            type: "math_trig"
          },

          {
            kind: "block",
            type: "math_constant"
          },

          {
            kind: "block",
            type: "math_number_property"
          },

          {
            kind: "block",
            type: "math_round"
          },

          {
            kind: "block",
            type: "math_modulo"
          },

          {
            kind: "block",
            type: "math_constrain"
          },

          {
            kind: "block",
            type: "math_random_int"
          },

          {
            kind: "block",
            type: "math_random_float"
          }

        ]
      },


      /*
       * -----------------------
       * VARIABLES
       * -----------------------
       */

      {
        kind: "category",
        name: "Variables",
        categorystyle: "variable_category",
        custom: "VARIABLE"
      },


      /*
       * -----------------------
       * FUNCTIONS
       * -----------------------
       */

      {
        kind: "category",
        name: "Functions",
        categorystyle: "procedure_category",
        custom: "PROCEDURE"
      },


      /*
       * -----------------------
       * TEXT / OUTPUT
       * -----------------------
       */

      {
        kind: "category",
        name: "Text / Output",
        categorystyle: "text_category",

        contents: [

          {
            kind: "block",
            type: "text"
          },

          {
            kind: "block",
            type: "text_join"
          },

          {
            kind: "block",
            type: "text_length"
          },

          {
            kind: "block",
            type: "text_isEmpty"
          },

          {
            kind: "block",
            type: "text_print"
          }

        ]
      }

    ]
  };


  /*
   * =======================================================
   * WORKSPACE
   * =======================================================
   */

  const workspace = Blockly.inject(

    "blocklyDiv",

    {

      toolbox: toolbox,

      trashcan: true,

      scrollbars: true,

      move: {

        scrollbars: true,
        drag: true,
        wheel: true

      },

      zoom: {

        controls: true,
        wheel: true,
        startScale: 1,
        maxScale: 2,
        minScale: 0.5,
        scaleSpeed: 1.2

      }

    }

  );


  /*
   * =======================================================
   * CONSOLE
   * =======================================================
   */

  const consoleOutput =
    document.getElementById("consoleOutput");

  const status =
    document.getElementById("status");


  function clearConsole() {

    consoleOutput.textContent = "";

  }


  function addConsoleLine(
    text,
    className = ""
  ) {

    const line =
      document.createElement("div");

    line.textContent = text;

    if (className) {

      line.className = className;

    }

    consoleOutput.appendChild(line);

  }


  function writeConsole(value) {

    addConsoleLine(
      "> " + String(value)
    );

  }


  /*
   * =======================================================
   * CUSTOM PRINT
   * =======================================================
   */

  javascript.javascriptGenerator.forBlock["text_print"] =
    function(block, generator) {

      const value =
        generator.valueToCode(
          block,
          "TEXT",
          javascript.Order.NONE
        ) || "''";

      return (
        "printToLab(" +
        value +
        ");\n"
      );

    };


  /*
   * =======================================================
   * OPERATION PROTECTION
   * =======================================================
   */

  javascript.javascriptGenerator.STATEMENT_PREFIX =
    "checkOperation();\n";


  /*
   * =======================================================
   * EXECUTION
   * =======================================================
   */

  function runProgram() {

    clearConsole();

    status.textContent =
      "Running...";


    let operations = 0;


    function checkOperation() {

      operations++;


      if (
        operations >
        MAX_OPERATIONS
      ) {

        throw new Error(
          "Maximum operation limit reached. " +
          "Check for a possible infinite loop " +
          "or recursive function."
        );

      }

    }


    try {

      /*
       * Generate JavaScript
       */

      const code =
        javascript.javascriptGenerator.workspaceToCode(
          workspace
        );


      /*
       * Execute generated program
       */

      const execute =
        new Function(

          "printToLab",
          "checkOperation",

          '"use strict";\n' +
          code

        );


      execute(
        writeConsole,
        checkOperation
      );


      /*
       * Program with no print
       */

      if (
        consoleOutput.textContent.trim() === ""
      ) {

        addConsoleLine(
          "Program finished with no output.",
          "console-placeholder"
        );

      }


      status.textContent =
        "Execution completed · " +
        operations +
        " operations.";

    }


    catch (error) {

      clearConsole();


      addConsoleLine(
        "ERROR",
        "console-error"
      );


      addConsoleLine(
        error.message,
        "console-error"
      );


      if (
        error.message.includes(
          "Maximum operation limit"
        )
      ) {

        addConsoleLine(
          "",
          "console-error"
        );

        addConsoleLine(
          "Execution stopped automatically.",
          "console-info"
        );

        addConsoleLine(
          "Review your loop condition or recursive function.",
          "console-info"
        );

      }


      status.textContent =
        "Execution stopped · " +
        operations +
        " operations.";

    }

  }


  /*
   * =======================================================
   * BUTTONS
   * =======================================================
   */

  document
    .getElementById("runButton")
    .addEventListener(
      "click",
      runProgram
    );


  document
    .getElementById("clearButton")
    .addEventListener(

      "click",

      function() {

        clearConsole();

        addConsoleLine(
          "Console cleared.",
          "console-placeholder"
        );

      }

    );


  document
    .getElementById("resetButton")
    .addEventListener(

      "click",

      function() {

        workspace.clear();

        clearConsole();

        addConsoleLine(
          "Ready.",
          "console-placeholder"
        );

        status.textContent =
          "Workspace reset.";

      }

    );

</script>

</body>
</html>
