<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Algorithm Lab</title>

  <!-- Blockly -->
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/en.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #202124;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #dadce0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header span {
      font-size: 14px;
      color: #5f6368;
    }

    .lab-container {
      padding: 20px;
    }

    .workspace-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
    }

    .workspace-panel,
    .console-panel {
      min-width: 0;
    }

    #blocklyDiv {
      width: 100%;
      height: 600px;
      background: white;
      border: 1px solid #dadce0;
      border-radius: 10px;
      overflow: hidden;
    }

    .console-panel {
      background: #202124;
      color: #f1f3f4;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      min-height: 600px;
      overflow: hidden;
    }

    .console-header {
      padding: 14px 16px;
      border-bottom: 1px solid #3c4043;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    #consoleOutput {
      padding: 16px;
      flex: 1;
      font-family: Consolas, "Courier New", monospace;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .console-placeholder {
      color: #9aa0a6;
    }

    .console-error {
      color: #f28b82;
    }

    .console-info {
      color: #8ab4f8;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 1px solid #dadce0;
      background: white;
      color: #202124;
      border-radius: 7px;
      padding: 10px 18px;
      min-height: 42px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #f1f3f4;
    }

    #runButton {
      background: #1a73e8;
      color: white;
      border-color: #1a73e8;
    }

    #runButton:hover {
      background: #1765cc;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #5f6368;
      min-height: 20px;
    }

    @media (max-width: 850px) {
      .workspace-layout {
        grid-template-columns: 1fr;
      }

      #blocklyDiv {
        height: 520px;
      }

      .console-panel {
        min-height: 220px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Algorithm Lab</h1>
  <span>Programming Workspace</span>
</header>

<div class="lab-container">

  <div class="workspace-layout">

    <div class="workspace-panel">
      <div id="blocklyDiv"></div>
    </div>

    <div class="console-panel">

      <div class="console-header">
        CONSOLE
      </div>

      <div id="consoleOutput">
        <span class="console-placeholder">Ready.</span>
      </div>

    </div>

  </div>

  <div class="controls">
    <button id="runButton">▶ Run</button>
    <button id="clearButton">Clear console</button>
    <button id="resetButton">↻ Reset workspace</button>
  </div>

  <div class="status" id="status">
    Build an algorithm and press Run.
  </div>

</div>

<script>

  /*
   * =======================================================
   * CONFIGURATION
   * =======================================================
   */

  const MAX_OPERATIONS = 10000;


  /*
   * =======================================================
   * TOOLBOX
   * =======================================================
   */

  const toolbox = {

    kind: "categoryToolbox",

    contents: [

      {
        kind: "category",
        name: "Logic",
        categorystyle: "logic_category",

        contents: [

          {
            kind: "block",
            type: "controls_if"
          },

          {
            kind: "block",
            type: "logic_compare"
          },

          {
            kind: "block",
            type: "logic_operation"
          },

          {
            kind: "block",
            type: "logic_negate"
          },

          {
            kind: "block",
            type: "logic_boolean"
          }

        ]
      },

      {
        kind: "category",
        name: "Loops",
        categorystyle: "loop_category",

        contents: [

          {
            kind: "block",
            type: "controls_repeat_ext"
          },

          {
            kind: "block",
            type: "controls_whileUntil"
          },

          {
            kind: "block",
            type: "controls_for"
          }

        ]
      },

      {
        kind: "category",
        name: "Math",
        categorystyle: "math_category",

        contents: [

          {
            kind: "block",
            type: "math_number"
          },

          {
            kind: "block",
            type: "math_arithmetic"
          },

          {
            kind: "block",
            type: "math_modulo"
          },

          {
            kind: "block",
            type: "math_round"
          }

        ]
      },

      {
        kind: "category",
        name: "Variables",
        categorystyle: "variable_category",
        custom: "VARIABLE"
      },

      {
        kind: "category",
        name: "Text",
        categorystyle: "text_category",

        contents: [

          {
            kind: "block",
            type: "text"
          },

          {
            kind: "block",
            type: "text_print"
          }

        ]
      }

    ]
  };


  /*
   * =======================================================
   * WORKSPACE
   * =======================================================
   */

  const workspace = Blockly.inject(

    "blocklyDiv",

    {

      toolbox: toolbox,

      trashcan: true,

      scrollbars: true,

      move: {
        scrollbars: true,
        drag: true,
        wheel: true
      },

      zoom: {
        controls: true,
        wheel: true,
        startScale: 1,
        maxScale: 2,
        minScale: 0.5,
        scaleSpeed: 1.2
      }

    }

  );


  /*
   * =======================================================
   * INTERFACE
   * =======================================================
   */

  const consoleOutput =
    document.getElementById("consoleOutput");

  const status =
    document.getElementById("status");


  function clearConsole() {

    consoleOutput.textContent = "";

  }


  function addConsoleLine(text, className = "") {

    const line =
      document.createElement("div");

    line.textContent = text;

    if (className) {
      line.className = className;
    }

    consoleOutput.appendChild(line);

  }


  function writeConsole(value) {

    addConsoleLine(
      "> " + String(value)
    );

  }


  /*
   * =======================================================
   * CUSTOM PRINT
   * =======================================================
   */

  javascript.javascriptGenerator.forBlock["text_print"] =
    function(block, generator) {

      const value =
        generator.valueToCode(
          block,
          "TEXT",
          javascript.Order.NONE
        ) || "''";

      return (
        "printToLab(" +
        value +
        ");\n"
      );

    };


  /*
   * =======================================================
   * LOOP PROTECTION
   * =======================================================
   *
   * Blockly supports statementPrefix.
   *
   * This inserts:
   *
   *    checkTimeout();
   *
   * before generated statements.
   *
   * Therefore a repeating program continually checks
   * whether it has exceeded the allowed operation count.
   *
   * =======================================================
   */

  javascript.javascriptGenerator.STATEMENT_PREFIX =
    "checkTimeout();\n";


  /*
   * =======================================================
   * EXECUTION
   * =======================================================
   */

  function runProgram() {

    clearConsole();

    status.textContent =
      "Running...";


    let operations = 0;


    function checkTimeout() {

      operations++;

      if (operations > MAX_OPERATIONS) {

        throw new Error(
          "Maximum operation limit reached. " +
          "Check for a possible infinite loop."
        );

      }

    }


    try {

      /*
       * Generate JavaScript from Blockly.
       */

      const code =
        javascript.javascriptGenerator.workspaceToCode(
          workspace
        );


      /*
       * Create isolated execution function.
       *
       * The generated program only receives the functions
       * that we explicitly provide.
       */

      const execute =
        new Function(

          "printToLab",
          "checkTimeout",

          '"use strict";\n' +
          code

        );


      /*
       * Execute program.
       */

      execute(
        writeConsole,
        checkTimeout
      );


      /*
       * If the algorithm produced no output:
       */

      if (
        consoleOutput.textContent.trim() === ""
      ) {

        addConsoleLine(
          "Program finished with no output.",
          "console-placeholder"
        );

      }


      status.textContent =
        "Execution completed. " +
        operations +
        " operations.";

    }

    catch (error) {

      clearConsole();

      addConsoleLine(
        "ERROR",
        "console-error"
      );

      addConsoleLine(
        error.message,
        "console-error"
      );


      if (
        error.message.includes(
          "Maximum operation limit"
        )
      ) {

        addConsoleLine(
          "",
          "console-error"
        );

        addConsoleLine(
          "Execution stopped automatically.",
          "console-info"
        );

        addConsoleLine(
          "Review your loop condition.",
          "console-info"
        );

      }


      status.textContent =
        "Execution stopped after " +
        operations +
        " operations.";

    }

  }


  /*
   * =======================================================
   * BUTTONS
   * =======================================================
   */

  document
    .getElementById("runButton")
    .addEventListener(
      "click",
      runProgram
    );


  document
    .getElementById("clearButton")
    .addEventListener(

      "click",

      function() {

        clearConsole();

        addConsoleLine(
          "Console cleared.",
          "console-placeholder"
        );

      }

    );


  document
    .getElementById("resetButton")
    .addEventListener(

      "click",

      function() {

        workspace.clear();

        clearConsole();

        addConsoleLine(
          "Ready.",
          "console-placeholder"
        );

        status.textContent =
          "Workspace reset.";

      }

    );

</script>

</body>
</html>
