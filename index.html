<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Algorithm Lab</title>

  <!-- Blockly -->
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/en.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #202124;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #dadce0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header span {
      font-size: 14px;
      color: #5f6368;
    }

    .lab-container {
      padding: 20px;
    }

    #blocklyDiv {
      width: 100%;
      height: 600px;
      background: white;
      border: 1px solid #dadce0;
      border-radius: 10px;
      overflow: hidden;
    }

    .footer {
      margin-top: 12px;
      font-size: 13px;
      color: #5f6368;
    }
  </style>
</head>

<body>

<header>
  <h1>Algorithm Lab</h1>
  <span>Programming Workspace</span>
</header>

<div class="lab-container">

  <div id="blocklyDiv"></div>

  <div class="footer">
    Build your algorithm using the available blocks.
  </div>

</div>

<script>

  const toolbox = {
    kind: "categoryToolbox",

    contents: [

      {
        kind: "category",
        name: "Logic",
        categorystyle: "logic_category",

        contents: [
          {
            kind: "block",
            type: "controls_if"
          },
          {
            kind: "block",
            type: "logic_compare"
          },
          {
            kind: "block",
            type: "logic_operation"
          },
          {
            kind: "block",
            type: "logic_negate"
          },
          {
            kind: "block",
            type: "logic_boolean"
          }
        ]
      },

      {
        kind: "category",
        name: "Loops",
        categorystyle: "loop_category",

        contents: [
          {
            kind: "block",
            type: "controls_repeat_ext"
          },
          {
            kind: "block",
            type: "controls_whileUntil"
          },
          {
            kind: "block",
            type: "controls_for"
          }
        ]
      },

      {
        kind: "category",
        name: "Math",
        categorystyle: "math_category",

        contents: [
          {
            kind: "block",
            type: "math_number"
          },
          {
            kind: "block",
            type: "math_arithmetic"
          },
          {
            kind: "block",
            type: "math_modulo"
          },
          {
            kind: "block",
            type: "math_round"
          }
        ]
      },

      {
        kind: "category",
        name: "Variables",
        categorystyle: "variable_category",
        custom: "VARIABLE"
      },

      {
        kind: "category",
        name: "Text",
        categorystyle: "text_category",

        contents: [
          {
            kind: "block",
            type: "text"
          },
          {
            kind: "block",
            type: "text_print"
          }
        ]
      }

    ]
  };


  const workspace = Blockly.inject(
    "blocklyDiv",
    {
      toolbox: toolbox,

      trashcan: true,

      scrollbars: true,

      move: {
        scrollbars: true,
        drag: true,
        wheel: true
      },

      zoom: {
        controls: true,
        wheel: true,
        startScale: 1,
        maxScale: 2,
        minScale: 0.5,
        scaleSpeed: 1.2
      }
    }
  );

</script>

</body>
</html>
