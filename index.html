<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Algorithm Lab v0.6.1</title>

  <!-- BLOCKLY -->
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #202124;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #dadce0;
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .title-group h1 {
      margin: 0;
      font-size: 22px;
    }

    .title-group p {
      margin: 4px 0 0;
      color: #5f6368;
      font-size: 13px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .language-selector {
      display: flex;
      background: #f1f3f4;
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .language-selector button {
      border: none;
      background: transparent;
      padding: 7px 11px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .language-selector button.active {
      background: #ffffff;
      color: #1a73e8;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    .version {
      color: #5f6368;
      font-size: 13px;
    }

    .lab-container {
      padding: 16px;
    }

    .workspace-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 16px;
    }

    #blocklyDiv {
      width: 100%;
      height: 620px;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 10px;
      overflow: hidden;
    }

    .console-panel {
      min-width: 0;
      min-height: 620px;
      background: #202124;
      color: #f1f3f4;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .console-header {
      padding: 14px 16px;
      border-bottom: 1px solid #3c4043;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: .5px;
    }

    #consoleOutput {
      flex: 1;
      padding: 16px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overflow-y: auto;
    }

    .console-placeholder {
      color: #9aa0a6;
    }

    .console-error {
      color: #f28b82;
    }

    .console-info {
      color: #8ab4f8;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .control-button {
      border: 1px solid #dadce0;
      background: #ffffff;
      color: #202124;
      border-radius: 7px;
      padding: 10px 18px;
      min-height: 42px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }

    .control-button:hover {
      background: #f1f3f4;
    }

    #runButton {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #ffffff;
    }

    #runButton:hover {
      background: #1765cc;
    }

    #evidenceButton {
      background: #188038;
      border-color: #188038;
      color: #ffffff;
      margin-left: auto;
    }

    #evidenceButton:hover {
      background: #137333;
    }

    #evidenceButton:disabled,
    #runButton:disabled {
      opacity: .55;
      cursor: wait;
    }

    .status-row {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: #5f6368;
    }

    #loadingMessage {
      padding: 40px;
      text-align: center;
      color: #5f6368;
    }

    @media (max-width: 850px) {
      .workspace-layout {
        grid-template-columns: 1fr;
      }

      #blocklyDiv {
        height: 540px;
      }

      .console-panel {
        min-height: 220px;
      }

      #evidenceButton {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="title-group">
    <h1>Algorithm Lab</h1>
    <p id="subtitle"></p>
  </div>

  <div class="header-right">
    <div class="language-selector">
      <button id="langES" type="button">ES</button>
      <button id="langEN" type="button">EN</button>
    </div>

    <div class="version">
      v0.6.1
    </div>
  </div>
</header>

<div class="lab-container">

  <div id="loadingMessage">
    Loading Algorithm Lab...
  </div>

  <div id="labInterface" style="display:none;">

    <div class="workspace-layout">

      <div id="blocklyDiv"></div>

      <div class="console-panel">

        <div
          class="console-header"
          id="consoleTitle"
        >
          CONSOLE
        </div>

        <div id="consoleOutput"></div>

      </div>

    </div>

    <div class="controls">

      <button
        id="runButton"
        class="control-button"
        type="button"
      >
        ▶ Run
      </button>

      <button
        id="clearButton"
        class="control-button"
        type="button"
      >
        Clear console
      </button>

      <button
        id="resetButton"
        class="control-button"
        type="button"
      >
        ↻ Reset workspace
      </button>

      <button
        id="evidenceButton"
        class="control-button"
        type="button"
      >
        ↓ Generate Evidence
      </button>

    </div>

    <div class="status-row">

      <span id="status"></span>

      <span id="operationLimit"></span>

    </div>

  </div>

</div>

<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const MAX_OPERATIONS = 10000;

const WORKSPACE_STORAGE_KEY =
  "algorithmLabWorkspace";

const EXECUTION_STORAGE_KEY =
  "algorithmLabExecution";


/* =========================================================
   LANGUAGE
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

let currentLanguage =
  params.get("lang") || "en";

if (
  currentLanguage !== "es" &&
  currentLanguage !== "en"
) {
  currentLanguage = "en";
}


/* =========================================================
   TRANSLATIONS
   ========================================================= */

const UI = {

  en: {

    subtitle:
      "Build, test and explore algorithms using blocks.",

    console:
      "CONSOLE",

    run:
      "▶ Run",

    clear:
      "Clear console",

    reset:
      "↻ Reset workspace",

    evidence:
      "↓ Generate Evidence",

    instruction:
      "Build an algorithm and press Run.",

    ready:
      "Ready.",

    running:
      "Running...",

    completed:
      "Execution completed",

    stopped:
      "Execution stopped",

    operations:
      "operations",

    maximum:
      "Maximum operations: 10,000",

    noOutput:
      "Program finished with no output.",

    consoleCleared:
      "Console cleared.",

    workspaceReset:
      "Workspace reset.",

    error:
      "ERROR",

    limitError:
      "Maximum operation limit reached. Check for a possible infinite loop or recursive function.",

    stoppedAutomatically:
      "Execution stopped automatically.",

    reviewLoop:
      "Review your loop condition or recursive function.",

    loading:
      "Loading Algorithm Lab...",

    generatingEvidence:
      "Generating evidence...",

    evidenceGenerated:
      "Evidence generated.",

    evidenceError:
      "Could not generate evidence.",

    emptyWorkspace:
      "The workspace is empty.",

    algorithm:
      "ALGORITHM",

    output:
      "OUTPUT",

    structures:
      "STRUCTURES USED",

    variables:
      "Variables",

    conditionals:
      "Conditionals",

    loops:
      "Loops",

    functions:
      "Functions",

    yes:
      "Yes",

    no:
      "No",

    generated:
      "Generated",

    algorithmEvidence:
      "Algorithm Evidence",

    notExecuted:
      "Program has not been executed.",

    lastExecution:
      "Last execution"

  },


  es: {

    subtitle:
      "Construye, prueba y explora algoritmos utilizando bloques.",

    console:
      "CONSOLA",

    run:
      "▶ Ejecutar",

    clear:
      "Limpiar consola",

    reset:
      "↻ Reiniciar espacio",

    evidence:
      "↓ Generar evidencia",

    instruction:
      "Construye un algoritmo y presiona Ejecutar.",

    ready:
      "Listo.",

    running:
      "Ejecutando...",

    completed:
      "Ejecución completada",

    stopped:
      "Ejecución detenida",

    operations:
      "operaciones",

    maximum:
      "Máximo de operaciones: 10,000",

    noOutput:
      "El programa terminó sin generar salida.",

    consoleCleared:
      "Consola limpiada.",

    workspaceReset:
      "Espacio de trabajo reiniciado.",

    error:
      "ERROR",

    limitError:
      "Se alcanzó el límite máximo de operaciones. Revisa si existe un ciclo infinito o una función recursiva.",

    stoppedAutomatically:
      "La ejecución se detuvo automáticamente.",

    reviewLoop:
      "Revisa la condición del ciclo o la función recursiva.",

    loading:
      "Cargando Algorithm Lab...",

    generatingEvidence:
      "Generando evidencia...",

    evidenceGenerated:
      "Evidencia generada.",

    evidenceError:
      "No fue posible generar la evidencia.",

    emptyWorkspace:
      "El espacio de trabajo está vacío.",

    algorithm:
      "ALGORITMO",

    output:
      "SALIDA",

    structures:
      "ESTRUCTURAS UTILIZADAS",

    variables:
      "Variables",

    conditionals:
      "Condicionales",

    loops:
      "Ciclos",

    functions:
      "Funciones",

    yes:
      "Sí",

    no:
      "No",

    generated:
      "Generado",

    algorithmEvidence:
      "Evidencia de algoritmo",

    notExecuted:
      "El programa todavía no ha sido ejecutado.",

    lastExecution:
      "Última ejecución"

  }

};

const T =
  UI[currentLanguage];


/* =========================================================
   STATIC INTERFACE
   ========================================================= */

document.documentElement.lang =
  currentLanguage;

document.getElementById(
  "subtitle"
).textContent =
  T.subtitle;

document.getElementById(
  "consoleTitle"
).textContent =
  T.console;

document.getElementById(
  "runButton"
).textContent =
  T.run;

document.getElementById(
  "clearButton"
).textContent =
  T.clear;

document.getElementById(
  "resetButton"
).textContent =
  T.reset;

document.getElementById(
  "evidenceButton"
).textContent =
  T.evidence;

document.getElementById(
  "operationLimit"
).textContent =
  T.maximum;

document.getElementById(
  "status"
).textContent =
  T.instruction;

document.getElementById(
  "loadingMessage"
).textContent =
  T.loading;

document.getElementById(
  "langES"
).classList.toggle(
  "active",
  currentLanguage === "es"
);

document.getElementById(
  "langEN"
).classList.toggle(
  "active",
  currentLanguage === "en"
);


/* =========================================================
   GLOBAL STATE
   ========================================================= */

let workspace = null;

let lastExecution = {
  executed: false,
  output: "",
  operations: 0,
  success: false
};


/* =========================================================
   LOAD BLOCKLY LANGUAGE
   ========================================================= */

const languageScript =
  document.createElement(
    "script"
  );

languageScript.src =
  currentLanguage === "es"
    ? "https://unpkg.com/blockly/msg/es.js"
    : "https://unpkg.com/blockly/msg/en.js";

languageScript.onload =
  initializeLab;

languageScript.onerror =
  function() {

    document.getElementById(
      "loadingMessage"
    ).textContent =
      "Error loading Blockly language.";

  };

document.head.appendChild(
  languageScript
);


/* =========================================================
   INITIALIZE LAB
   ========================================================= */

function initializeLab() {

  const categoryNames = {

    en: {
      logic: "Logic",
      loops: "Loops",
      math: "Math",
      variables: "Variables",
      functions: "Functions",
      text: "Text / Output"
    },

    es: {
      logic: "Lógica",
      loops: "Ciclos",
      math: "Matemáticas",
      variables: "Variables",
      functions: "Funciones",
      text: "Texto / Salida"
    }

  };

  const C =
    categoryNames[currentLanguage];


  /* TOOLBOX */

  const toolbox = {

    kind: "categoryToolbox",

    contents: [

      {
        kind: "category",
        name: C.logic,
        categorystyle: "logic_category",

        contents: [

          {
            kind: "block",
            type: "controls_if"
          },

          {
            kind: "block",
            type: "logic_compare"
          },

          {
            kind: "block",
            type: "logic_operation"
          },

          {
            kind: "block",
            type: "logic_negate"
          },

          {
            kind: "block",
            type: "logic_boolean"
          },

          {
            kind: "block",
            type: "logic_null"
          },

          {
            kind: "block",
            type: "logic_ternary"
          }

        ]
      },


      {
        kind: "category",
        name: C.loops,
        categorystyle: "loop_category",

        contents: [

          {
            kind: "block",
            type: "controls_repeat_ext"
          },

          {
            kind: "block",
            type: "controls_whileUntil"
          },

          {
            kind: "block",
            type: "controls_for"
          },

          {
            kind: "block",
            type: "controls_forEach"
          },

          {
            kind: "block",
            type: "controls_flow_statements"
          }

        ]
      },


      {
        kind: "category",
        name: C.math,
        categorystyle: "math_category",

        contents: [

          {
            kind: "block",
            type: "math_number"
          },

          {
            kind: "block",
            type: "math_arithmetic"
          },

          {
            kind: "block",
            type: "math_single"
          },

          {
            kind: "block",
            type: "math_trig"
          },

          {
            kind: "block",
            type: "math_constant"
          },

          {
            kind: "block",
            type: "math_number_property"
          },

          {
            kind: "block",
            type: "math_round"
          },

          {
            kind: "block",
            type: "math_modulo"
          },

          {
            kind: "block",
            type: "math_constrain"
          },

          {
            kind: "block",
            type: "math_random_int"
          },

          {
            kind: "block",
            type: "math_random_float"
          }

        ]
      },


      {
        kind: "category",
        name: C.variables,
        categorystyle: "variable_category",
        custom: "VARIABLE"
      },


      {
        kind: "category",
        name: C.functions,
        categorystyle: "procedure_category",
        custom: "PROCEDURE"
      },


      {
        kind: "category",
        name: C.text,
        categorystyle: "text_category",

        contents: [

          {
            kind: "block",
            type: "text"
          },

          {
            kind: "block",
            type: "text_join"
          },

          {
            kind: "block",
            type: "text_length"
          },

          {
            kind: "block",
            type: "text_isEmpty"
          },

          {
            kind: "block",
            type: "text_print"
          }

        ]
      }

    ]

  };


  /* CREATE WORKSPACE */

  workspace =
    Blockly.inject(
      "blocklyDiv",
      {
        toolbox: toolbox,

        trashcan: true,

        scrollbars: true,

        move: {
          scrollbars: true,
          drag: true,
          wheel: true
        },

        zoom: {
          controls: true,
          wheel: true,
          startScale: 1,
          maxScale: 2,
          minScale: 0.5,
          scaleSpeed: 1.2
        }
      }
    );


  /* CUSTOM PRINT */

  javascript
    .javascriptGenerator
    .forBlock["text_print"] =
    function(
      block,
      generator
    ) {

      const value =
        generator.valueToCode(
          block,
          "TEXT",
          javascript.Order.NONE
        ) || "''";

      return (
        "printToLab(" +
        value +
        ");\n"
      );

    };


  /* OPERATION COUNTER */

  javascript
    .javascriptGenerator
    .STATEMENT_PREFIX =
      "checkOperation();\n";


  restoreWorkspace();
  restoreExecution();


  document.getElementById(
    "loadingMessage"
  ).style.display =
    "none";

  document.getElementById(
    "labInterface"
  ).style.display =
    "block";

  Blockly.svgResize(
    workspace
  );


  if (
    lastExecution.executed
  ) {

    restoreConsoleFromExecution();

  } else {

    clearConsole();

    addConsoleLine(
      T.ready,
      "console-placeholder"
    );

  }

}


/* =========================================================
   CONSOLE
   ========================================================= */

const consoleOutput =
  document.getElementById(
    "consoleOutput"
  );


function clearConsole() {

  consoleOutput.textContent = "";

}


function addConsoleLine(
  text,
  className = ""
) {

  const line =
    document.createElement(
      "div"
    );

  line.textContent =
    text;

  if (className) {
    line.className =
      className;
  }

  consoleOutput.appendChild(
    line
  );

}


function writeConsole(value) {

  addConsoleLine(
    "> " + String(value)
  );

}


function restoreConsoleFromExecution() {

  clearConsole();

  if (
    !lastExecution.output
  ) {

    addConsoleLine(
      T.noOutput,
      "console-placeholder"
    );

    return;

  }

  const lines =
    lastExecution.output.split(
      "\n"
    );

  lines.forEach(
    line => {
      addConsoleLine(line);
    }
  );

}


/* =========================================================
   EXECUTION
   ========================================================= */

function runProgram() {

  clearConsole();

  document.getElementById(
    "status"
  ).textContent =
    T.running;

  let operations = 0;


  function checkOperation() {

    operations++;

    if (
      operations >
      MAX_OPERATIONS
    ) {

      throw new Error(
        T.limitError
      );

    }

  }


  try {

    const code =
      javascript
        .javascriptGenerator
        .workspaceToCode(
          workspace
        );


    const execute =
      new Function(
        "printToLab",
        "checkOperation",
        '"use strict";\n' + code
      );


    execute(
      writeConsole,
      checkOperation
    );


    if (
      consoleOutput
        .textContent
        .trim() === ""
    ) {

      addConsoleLine(
        T.noOutput,
        "console-placeholder"
      );

    }


    lastExecution = {

      executed: true,

      output:
        consoleOutput
          .innerText
          .trim(),

      operations:
        operations,

      success:
        true

    };


    saveExecution();


    document.getElementById(
      "status"
    ).textContent =
      T.completed +
      " · " +
      operations +
      " " +
      T.operations +
      ".";

  }


  catch (error) {

    clearConsole();

    addConsoleLine(
      T.error,
      "console-error"
    );

    addConsoleLine(
      error.message,
      "console-error"
    );


    if (
      error.message ===
      T.limitError
    ) {

      addConsoleLine("");

      addConsoleLine(
        T.stoppedAutomatically,
        "console-info"
      );

      addConsoleLine(
        T.reviewLoop,
        "console-info"
      );

    }


    lastExecution = {

      executed: true,

      output:
        consoleOutput
          .innerText
          .trim(),

      operations:
        operations,

      success:
        false

    };


    saveExecution();


    document.getElementById(
      "status"
    ).textContent =
      T.stopped +
      " · " +
      operations +
      " " +
      T.operations +
      ".";

  }

}


/* =========================================================
   STORAGE
   ========================================================= */

function saveWorkspace() {

  if (!workspace) {
    return;
  }

  try {

    const state =
      Blockly.serialization
        .workspaces
        .save(
          workspace
        );

    sessionStorage.setItem(
      WORKSPACE_STORAGE_KEY,
      JSON.stringify(state)
    );

  }

  catch (error) {

    console.error(
      "Could not save workspace.",
      error
    );

  }

}


function restoreWorkspace() {

  const saved =
    sessionStorage.getItem(
      WORKSPACE_STORAGE_KEY
    );

  if (!saved) {
    return;
  }

  try {

    const state =
      JSON.parse(saved);

    Blockly.serialization
      .workspaces
      .load(
        state,
        workspace
      );

  }

  catch (error) {

    console.error(
      "Could not restore workspace.",
      error
    );

  }

}


function saveExecution() {

  try {

    sessionStorage.setItem(
      EXECUTION_STORAGE_KEY,
      JSON.stringify(
        lastExecution
      )
    );

  }

  catch (error) {

    console.error(
      "Could not save execution.",
      error
    );

  }

}


function restoreExecution() {

  const saved =
    sessionStorage.getItem(
      EXECUTION_STORAGE_KEY
    );

  if (!saved) {
    return;
  }

  try {

    lastExecution =
      JSON.parse(saved);

  }

  catch (error) {

    console.error(
      "Could not restore execution.",
      error
    );

  }

}


/* =========================================================
   LANGUAGE SWITCHING
   ========================================================= */

function switchLanguage(language) {

  if (
    language ===
    currentLanguage
  ) {
    return;
  }

  saveWorkspace();
  saveExecution();

  const url =
    new URL(
      window.location.href
    );

  url.searchParams.set(
    "lang",
    language
  );

  window.location.href =
    url.toString();

}


document.getElementById(
  "langES"
).addEventListener(
  "click",
  function() {
    switchLanguage("es");
  }
);


document.getElementById(
  "langEN"
).addEventListener(
  "click",
  function() {
    switchLanguage("en");
  }
);


/* =========================================================
   STRUCTURE DETECTION
   ========================================================= */

function detectStructures() {

  const blocks =
    workspace.getAllBlocks(
      false
    );

  const types =
    blocks.map(
      block => block.type
    );

  return {

    variables:
      types.some(
        type =>
          type.startsWith(
            "variables_"
          )
      ),

    conditionals:
      types.includes(
        "controls_if"
      ),

    loops:
      types.some(
        type =>
          type === "controls_repeat_ext" ||
          type === "controls_whileUntil" ||
          type === "controls_for" ||
          type === "controls_forEach"
      ),

    functions:
      types.some(
        type =>
          type.startsWith(
            "procedures_"
          )
      )

  };

}


/* =========================================================
   WORKSPACE SVG EXPORT
   ========================================================= */

function createWorkspaceImage() {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      try {

        const canvasGroup =
          workspace.getCanvas();

        const bbox =
          canvasGroup.getBBox();


        if (
          bbox.width <= 0 ||
          bbox.height <= 0
        ) {

          reject(
            new Error(
              T.emptyWorkspace
            )
          );

          return;

        }


        const padding = 40;

        const exportWidth =
          Math.ceil(
            bbox.width +
            padding * 2
          );

        const exportHeight =
          Math.ceil(
            bbox.height +
            padding * 2
          );


        const clone =
          canvasGroup.cloneNode(
            true
          );


        /*
         * Blockly blocks use CSS classes for
         * some visual properties.
         *
         * We copy the computed styles directly
         * into the cloned SVG nodes so the
         * exported image does not depend on
         * external stylesheets.
         */

        const originalElements =
          canvasGroup.querySelectorAll(
            "*"
          );

        const clonedElements =
          clone.querySelectorAll(
            "*"
          );


        for (
          let i = 0;
          i < originalElements.length;
          i++
        ) {

          const original =
            originalElements[i];

          const cloned =
            clonedElements[i];

          if (!cloned) {
            continue;
          }

          const computed =
            window.getComputedStyle(
              original
            );

          const properties = [
            "fill",
            "fill-opacity",
            "stroke",
            "stroke-width",
            "stroke-opacity",
            "font-family",
            "font-size",
            "font-weight",
            "font-style",
            "opacity",
            "display"
          ];

          properties.forEach(
            property => {

              const value =
                computed.getPropertyValue(
                  property
                );

              if (value) {

                cloned.style.setProperty(
                  property,
                  value
                );

              }

            }
          );

        }


        const svg =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
          );


        svg.setAttribute(
          "xmlns",
          "http://www.w3.org/2000/svg"
        );

        svg.setAttribute(
          "xmlns:xlink",
          "http://www.w3.org/1999/xlink"
        );

        svg.setAttribute(
          "width",
          exportWidth
        );

        svg.setAttribute(
          "height",
          exportHeight
        );

        svg.setAttribute(
          "viewBox",
          (
            bbox.x - padding
          ) +
          " " +
          (
            bbox.y - padding
          ) +
          " " +
          exportWidth +
          " " +
          exportHeight
        );


        const background =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "rect"
          );


        background.setAttribute(
          "x",
          bbox.x - padding
        );

        background.setAttribute(
          "y",
          bbox.y - padding
        );

        background.setAttribute(
          "width",
          exportWidth
        );

        background.setAttribute(
          "height",
          exportHeight
        );

        background.setAttribute(
          "fill",
          "#ffffff"
        );


        svg.appendChild(
          background
        );


        const style =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "style"
          );


        style.textContent = `
          text {
            font-family: Arial, Helvetica, sans-serif;
          }

          .blocklyText {
            font-family: Arial, Helvetica, sans-serif;
          }
        `;


        svg.appendChild(
          style
        );

        svg.appendChild(
          clone
        );


        const serializer =
          new XMLSerializer();


        const source =
          serializer.serializeToString(
            svg
          );


        const blob =
          new Blob(
            [source],
            {
              type:
                "image/svg+xml;charset=utf-8"
            }
          );


        const url =
          URL.createObjectURL(
            blob
          );


        const image =
          new Image();


        image.onload =
          function() {

            URL.revokeObjectURL(
              url
            );

            resolve({
              image: image,
              width: exportWidth,
              height: exportHeight
            });

          };


        image.onerror =
          function() {

            URL.revokeObjectURL(
              url
            );

            reject(
              new Error(
                currentLanguage === "es"
                  ? "No fue posible renderizar los bloques."
                  : "Could not render Blockly blocks."
              )
            );

          };


        image.src =
          url;

      }

      catch (error) {

        reject(error);

      }

    }
  );

}


/* =========================================================
   CANVAS TEXT WRAPPING
   ========================================================= */

function getWrappedLines(
  context,
  text,
  maxWidth
) {

  const result = [];

  const paragraphs =
    String(text).split(
      "\n"
    );


  paragraphs.forEach(
    paragraph => {

      if (
        paragraph.trim() === ""
      ) {

        result.push("");

        return;

      }


      const words =
        paragraph.split(" ");

      let line = "";


      words.forEach(
        word => {

          const testLine =
            line
              ? line + " " + word
              : word;

          const width =
            context.measureText(
              testLine
            ).width;


          if (
            width > maxWidth &&
            line
          ) {

            result.push(line);

            line = word;

          } else {

            line =
              testLine;

          }

        }
      );


      if (line) {

        result.push(line);

      }

    }
  );


  return result;

}


/* =========================================================
   GENERATE EVIDENCE
   ========================================================= */

async function generateEvidence() {

  if (!workspace) {
    return;
  }


  const evidenceButton =
    document.getElementById(
      "evidenceButton"
    );


  evidenceButton.disabled =
    true;


  document.getElementById(
    "status"
  ).textContent =
    T.generatingEvidence;


  try {

    const blockData =
      await createWorkspaceImage();


    const structures =
      detectStructures();


    const PAGE_WIDTH =
      1400;

    const SIDE_PADDING =
      80;

    const CONTENT_WIDTH =
      PAGE_WIDTH -
      SIDE_PADDING * 2;


    /*
     * Prevent extremely wide algorithms from
     * producing microscopic evidence.
     */

    const algorithmScale =
      Math.min(
        1.4,
        CONTENT_WIDTH /
          blockData.width
      );


    const algorithmWidth =
      blockData.width *
      algorithmScale;


    const algorithmHeight =
      blockData.height *
      algorithmScale;


    const outputText =
      lastExecution.executed
        ? (
            lastExecution.output ||
            T.noOutput
          )
        : T.notExecuted;


    /*
     * Temporary canvas for text measurement.
     */

    const measurementCanvas =
      document.createElement(
        "canvas"
      );

    const measurementContext =
      measurementCanvas.getContext(
        "2d"
      );


    measurementContext.font =
      '20px "Courier New"';


    const outputLines =
      getWrappedLines(
        measurementContext,
        outputText,
        CONTENT_WIDTH
      );


    const OUTPUT_LINE_HEIGHT =
      30;


    const outputContentHeight =
      Math.max(
        50,
        outputLines.length *
          OUTPUT_LINE_HEIGHT
      );


    const HEADER_HEIGHT =
      155;

    const ALGORITHM_TITLE_HEIGHT =
      65;

    const ALGORITHM_PADDING =
      30;

    const OUTPUT_TITLE_HEIGHT =
      65;

    const STRUCTURES_HEIGHT =
      235;

    const FOOTER_HEIGHT =
      100;


    const PAGE_HEIGHT =
      Math.ceil(
        HEADER_HEIGHT +
        ALGORITHM_TITLE_HEIGHT +
        algorithmHeight +
        ALGORITHM_PADDING * 2 +
        55 +
        OUTPUT_TITLE_HEIGHT +
        outputContentHeight +
        55 +
        STRUCTURES_HEIGHT +
        FOOTER_HEIGHT
      );


    const evidenceCanvas =
      document.createElement(
        "canvas"
      );


    evidenceCanvas.width =
      PAGE_WIDTH;

    evidenceCanvas.height =
      PAGE_HEIGHT;


    const ctx =
      evidenceCanvas.getContext(
        "2d"
      );


    /*
     * BACKGROUND
     */

    ctx.fillStyle =
      "#ffffff";

    ctx.fillRect(
      0,
      0,
      PAGE_WIDTH,
      PAGE_HEIGHT
    );


    /*
     * HEADER
     */

    ctx.fillStyle =
      "#202124";

    ctx.font =
      "bold 40px Arial";

    ctx.fillText(
      "Algorithm Lab",
      SIDE_PADDING,
      65
    );


    ctx.fillStyle =
      "#5f6368";

    ctx.font =
      "21px Arial";

    ctx.fillText(
      T.algorithmEvidence,
      SIDE_PADDING,
      105
    );


    ctx.textAlign =
      "right";

    ctx.font =
      "18px Arial";

    ctx.fillText(
      "v0.6.1",
      PAGE_WIDTH -
        SIDE_PADDING,
      65
    );


    ctx.textAlign =
      "left";


    ctx.strokeStyle =
      "#dadce0";

    ctx.lineWidth =
      2;

    ctx.beginPath();

    ctx.moveTo(
      SIDE_PADDING,
      132
    );

    ctx.lineTo(
      PAGE_WIDTH -
        SIDE_PADDING,
      132
    );

    ctx.stroke();


    /*
     * ALGORITHM
     */

    let y =
      HEADER_HEIGHT;


    ctx.fillStyle =
      "#202124";

    ctx.font =
      "bold 23px Arial";

    ctx.fillText(
      T.algorithm,
      SIDE_PADDING,
      y + 35
    );


    y +=
      ALGORITHM_TITLE_HEIGHT;


    ctx.fillStyle =
      "#f8f9fa";

    ctx.fillRect(
      SIDE_PADDING,
      y,
      CONTENT_WIDTH,
      algorithmHeight +
        ALGORITHM_PADDING * 2
    );


    const algorithmX =
      SIDE_PADDING +
      (
        CONTENT_WIDTH -
        algorithmWidth
      ) / 2;


    ctx.drawImage(
      blockData.image,
      algorithmX,
      y +
        ALGORITHM_PADDING,
      algorithmWidth,
      algorithmHeight
    );


    y +=
      algorithmHeight +
      ALGORITHM_PADDING * 2 +
      55;


    /*
     * OUTPUT
     */

    ctx.fillStyle =
      "#202124";

    ctx.font =
      "bold 23px Arial";

    ctx.fillText(
      T.output,
      SIDE_PADDING,
      y
    );


    y +=
      45;


    ctx.fillStyle =
      "#202124";

    ctx.font =
      '20px "Courier New"';


    outputLines.forEach(
      line => {

        ctx.fillText(
          line,
          SIDE_PADDING,
          y
        );

        y +=
          OUTPUT_LINE_HEIGHT;

      }
    );


    y += 30;


    /*
     * DIVIDER
     */

    ctx.strokeStyle =
      "#dadce0";

    ctx.beginPath();

    ctx.moveTo(
      SIDE_PADDING,
      y
    );

    ctx.lineTo(
      PAGE_WIDTH -
        SIDE_PADDING,
      y
    );

    ctx.stroke();


    y += 50;


    /*
     * STRUCTURES
     */

    ctx.fillStyle =
      "#202124";

    ctx.font =
      "bold 23px Arial";

    ctx.fillText(
      T.structures,
      SIDE_PADDING,
      y
    );


    y += 45;


    const structureRows = [

      [
        T.variables,
        structures.variables
      ],

      [
        T.conditionals,
        structures.conditionals
      ],

      [
        T.loops,
        structures.loops
      ],

      [
        T.functions,
        structures.functions
      ]

    ];


    structureRows.forEach(
      row => {

        ctx.fillStyle =
          "#202124";

        ctx.font =
          "19px Arial";

        ctx.fillText(
          row[0],
          SIDE_PADDING,
          y
        );


        ctx.font =
          "bold 19px Arial";

        ctx.fillText(
          row[1]
            ? T.yes
            : T.no,
          SIDE_PADDING + 270,
          y
        );


        y += 34;

      }
    );


    y += 20;


    /*
     * EXECUTION INFORMATION
     */

    ctx.fillStyle =
      "#5f6368";

    ctx.font =
      "17px Arial";


    if (
      lastExecution.executed
    ) {

      ctx.fillText(
        T.lastExecution +
        ": " +
        (
          lastExecution.success
            ? T.completed
            : T.stopped
        ) +
        " · " +
        lastExecution.operations +
        " " +
        T.operations,
        SIDE_PADDING,
        y
      );

    } else {

      ctx.fillText(
        T.notExecuted,
        SIDE_PADDING,
        y
      );

    }


    /*
     * FOOTER
     */

    const now =
      new Date();


    const formattedDate =
      now.toLocaleString(
        currentLanguage === "es"
          ? "es-MX"
          : "en-US"
      );


    ctx.fillStyle =
      "#5f6368";

    ctx.font =
      "16px Arial";

    ctx.fillText(
      T.generated +
      ": " +
      formattedDate,
      SIDE_PADDING,
      PAGE_HEIGHT - 45
    );


    ctx.textAlign =
      "right";

    ctx.fillText(
      "Algorithm Lab · v0.6.1",
      PAGE_WIDTH -
        SIDE_PADDING,
      PAGE_HEIGHT - 45
    );


    ctx.textAlign =
      "left";


    /*
     * DOWNLOAD
     */

    evidenceCanvas.toBlob(
      function(blob) {

        if (!blob) {

          evidenceButton.disabled =
            false;

          document.getElementById(
            "status"
          ).textContent =
            T.evidenceError;

          return;

        }


        const url =
          URL.createObjectURL(
            blob
          );


        const link =
          document.createElement(
            "a"
          );


        const timestamp =
          new Date()
            .toISOString()
            .replace(
              /[:.]/g,
              "-"
            );


        link.href =
          url;


        link.download =
          "algorithm_evidence_" +
          timestamp +
          ".png";


        document.body.appendChild(
          link
        );


        link.click();

        link.remove();


        setTimeout(
          function() {

            URL.revokeObjectURL(
              url
            );

          },
          1500
        );


        document.getElementById(
          "status"
        ).textContent =
          T.evidenceGenerated;


        evidenceButton.disabled =
          false;

      },

      "image/png"

    );

  }


  catch (error) {

    console.error(error);


    document.getElementById(
      "status"
    ).textContent =
      T.evidenceError +
      " " +
      error.message;


    evidenceButton.disabled =
      false;

  }

}


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

document.getElementById(
  "runButton"
).addEventListener(
  "click",
  runProgram
);


document.getElementById(
  "clearButton"
).addEventListener(
  "click",
  function() {

    clearConsole();

    addConsoleLine(
      T.consoleCleared,
      "console-placeholder"
    );

  }
);


document.getElementById(
  "resetButton"
).addEventListener(
  "click",
  function() {

    if (!workspace) {
      return;
    }


    workspace.clear();


    clearConsole();


    lastExecution = {
      executed: false,
      output: "",
      operations: 0,
      success: false
    };


    sessionStorage.removeItem(
      WORKSPACE_STORAGE_KEY
    );

    sessionStorage.removeItem(
      EXECUTION_STORAGE_KEY
    );


    addConsoleLine(
      T.ready,
      "console-placeholder"
    );


    document.getElementById(
      "status"
    ).textContent =
      T.workspaceReset;

  }
);


document.getElementById(
  "evidenceButton"
).addEventListener(
  "click",
  generateEvidence
);

</script>
